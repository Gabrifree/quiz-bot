<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configura Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #ffffff); font-weight: bold; margin-top: 25px; border: none; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>⚙️ Setup Simulazione</h2>

    <label>📚 Seleziona Database:</label>
    <select id="db_type" onchange="toggleChapters()">
        <option value="standard">Database Standard</option>
        <option value="comptia">🇮🇹 Domande Ita CompTIA</option>
    </select>

    <div id="chapter_div" class="hidden">
        <label>📖 Seleziona Capitolo:</label>
        <select id="chapter">
            <option value="all">Tutti i capitoli (Mix)</option>
            <option value="1">Cap 1 - Il professionista della sicurezza, oggi</option>
            <option value="2">Cap 2 - Panorama delle minacce alla sicurezza</option>
            <option value="3">Cap 3 - Codice malevolo</option>
            <option value="4">Cap 4 - Ingegneria sociale e attacchi alle password</option>
            <option value="5">Cap 5 - Valutazione e test della sicurezza</option>
            <option value="6">Cap 6 - Sicurezza delle applicazioni</option>
            <option value="7">Cap 7 - Crittografia e PKI</option>
            <option value="8">Cap 8 - Gestione identità e accessi</option>
            <option value="9">Cap 9 - Resilienza e sicurezza fisica</option>
            <option value="10">Cap 10 - Sicurezza cloud e virtualizzazione</option>
            <option value="11">Cap 11 - Sicurezza degli endpoint</option>
            <option value="12">Cap 12 - Sicurezza della rete</option>
            <option value="13">Cap 13 - Sicurezza wireless e mobile</option>
            <option value="14">Cap 14 - Monitoraggio e risposta agli incidenti</option>
            <option value="15">Cap 15 - Analisi forense digitale</option>
            <option value="16">Cap 16 - Governance e conformità della sicurezza</option>
            <option value="17">Cap 17 - Gestione dei rischi e privacy</option>
        </select>
    </div>

    <label>🔢 Numero Domande:</label>
    <select id="num">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="90">90 (Esame Completo)</option>
        <option value="all">Tutte</option>
    </select>

    <label>🎯 Modalità:</label>
    <select id="feedback">
        <option value="feed_now">⚡ Studio Guidato (Correzione immediata)</option>
        <option value="exam">🙈 Simulazione Esame (Risultato alla fine)</option>
    </select>

    <label>⏱️ Timer:</label>
    <select id="timer">
        <option value="false">Senza Timer</option>
        <option value="true">Con Timer (90 min max)</option>
    </select>

    <button onclick="sendData()">🚀 AVVIA TEST</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function toggleChapters() {
            let db = document.getElementById("db_type").value;
            let chapterDiv = document.getElementById("chapter_div");
            if (db === "comptia") {
                chapterDiv.classList.remove("hidden");
            } else {
                chapterDiv.classList.add("hidden");
            }
        }

        function sendData() {
            let data = {
                db_type: document.getElementById("db_type").value,
                chapter: document.getElementById("chapter").value,
                num: document.getElementById("num").value,
                feedback: document.getElementById("feedback").value,
                timer: document.getElementById("timer").value === "true"
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
